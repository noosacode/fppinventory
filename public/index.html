<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Frangipani Inventory</title><link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">F</div><p class="eyebrow">NURSERY INVENTORY</p>
    <h1>Frangipani inventory</h1><p class="muted">Keep stock, pricing and store reconciliation in one place.</p>
    <div id="auth-message" class="notice hidden"></div>
    <form id="login-form" class="stack">
      <label>Username<input id="username" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Sign in</button>
    </form>
    <a id="setup-link" class="hidden" href="/setup.html">Set up the first administrator</a>
  </main><script src="/js/login.js"></script>
</body></html>
