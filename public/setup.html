<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial setup · Frangipani inventory</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="login-page"><main class="login-card"><a class="back-link" href="/">← Sign in</a><div class="brand-mark">F</div><p class="eyebrow">FIRST TIME SETUP</p><h1>Create your administrator login</h1><p class="muted">This setup is only available until the first account is created.</p><div id="auth-message" class="notice hidden"></div>
